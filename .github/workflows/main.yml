name: Build, push and deploy

on:
  push:
    branches:
      - "main"

    paths-ignore:
      - "README.md"

jobs:
  # Build the Lambda container image, push it to ECR, then provision
  # infrastructure (Lambda / S3 / ECR / IAM / EventBridge) with Terraform.
  deploy:
    name: Build & deploy for ${{ matrix.region }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        region: [us-east-1]
      fail-fast: false

    env:
      ECR_REPO_NAME: prospect-mailer

    steps:
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      # -------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr
        run: |
          REGISTRY=$(aws ecr describe-registry --query 'registryUri' --output text)
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region ${{ matrix.region }} \
            | docker login --username AWS --password-stdin "$REGISTRY"

      # -------------------------------------------------
      - name: Create ECR repository if absent
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" \
            || aws ecr create-repository --repository-name "$ECR_REPO_NAME"

      # -------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------
      - name: Build & push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            --push \
            ./app

      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      - name: Create Terraform state bucket if absent
        run: |
          BUCKET="prospect-mailer-terraform-state"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region ${{ matrix.region }} \
              --create-bucket-configuration LocationConstraint=${{ matrix.region }}
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,BlockPublicPolicy=true,IgnorePublicAcls=true,RestrictPublicBuckets=true
          fi

      # -------------------------------------------------
      - name: Terraform Init
        run: terraform -chdir=${GITHUB_WORKSPACE}/terraform/regions/${{ matrix.region }} init

      # -------------------------------------------------
      - name: Terraform Validate
        run: terraform -chdir=${GITHUB_WORKSPACE}/terraform/regions/${{ matrix.region }} validate

      # -------------------------------------------------
      - name: Terraform Plan
        run: terraform -chdir=${GITHUB_WORKSPACE}/terraform/regions/${{ matrix.region }} plan -out=tfplan \
          -var="aws_region=${{ matrix.region }}" \
          -var="image_tag=$GITHUB_SHA" \
          -var="zoho_pwd=${{ secrets.ZOHO_PWD }}" \
          -var-file=${GITHUB_WORKSPACE}/terraform/env/dev.tfvars

      # -------------------------------------------------
      - name: Terraform Apply
        run: terraform -chdir=${GITHUB_WORKSPACE}/terraform/regions/${{ matrix.region }} apply -auto-approve tfplan
