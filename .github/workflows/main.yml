name: Build, push and deploy

on:
  push:
    branches:
      - "main"

    paths-ignore:
      - "README.md"
      - "schemas/**"

jobs:
  # Build the Lambda container image, push it to ECR, then provision
  # infrastructure (Lambda / S3 / ECR / IAM / EventBridge) with Terraform.
  deploy:
    name: Build & deploy for ${{ matrix.region }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        region: [us-east-1]
      fail-fast: false

    env:
      ECR_REPO_NAME: prospect-mailer

    steps:
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      # -------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ matrix.region }}.amazonaws.com"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region ${{ matrix.region }} \
            | docker login --username AWS --password-stdin "$REGISTRY"

      # -------------------------------------------------
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      # -------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------
      - name: Build & push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --no-cache \
            --provenance=false \
            --sbom=false \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            --push \
            ./app

      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------
      - name: Create Terraform state bucket if absent
        run: |
          BUCKET="prospect-mailer-terraform-state"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "${{ matrix.region }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region ${{ matrix.region }}
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region ${{ matrix.region }} \
                --create-bucket-configuration LocationConstraint=${{ matrix.region }}
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,BlockPublicPolicy=true,IgnorePublicAcls=true,RestrictPublicBuckets=true
          fi

      # -------------------------------------------------
      - name: Terraform Init
        working-directory: terraform/regions/${{ matrix.region }}
        run: terraform init

      # -------------------------------------------------
      - name: Terraform Validate
        working-directory: terraform/regions/${{ matrix.region }}
        run: terraform validate

      # -------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform/regions/${{ matrix.region }}
        run: |
          terraform plan -out=tfplan \
            -var="aws_region=${{ matrix.region }}" \
            -var="image_tag=$GITHUB_SHA" \
            -var="zoho_pwd=${{ secrets.ZOHO_PWD }}" \
            -var="resend_api_key=${{ secrets.RESEND_API_KEY }}" \
            -var-file=${GITHUB_WORKSPACE}/terraform/env/dev.tfvars

      # -------------------------------------------------
      - name: Terraform Apply
        working-directory: terraform/regions/${{ matrix.region }}
        run: terraform apply -auto-approve tfplan
